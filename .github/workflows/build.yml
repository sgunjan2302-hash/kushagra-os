name: Build Kushagra OS

on:
  schedule:
    - cron: '00 06 * * *' # Daily build at 06:00 UTC
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  bluebuild:
    name: Build and Push OCI Image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      actions: write
      id-token: write
    steps:
      - name: Build Kushagra OS Image
        uses: blue-build/github-action@v1.14.0
        with:
          recipe: recipe.yml
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: 'true'
          # Set chunkah: 'false' for fast iteration during testing.
          # For production releases, toggle chunkah: 'true' to reduce pull bandwidth.
          # NEVER use deprecated rechunk: 'true'.
          chunkah: 'false'

      - name: Trigger LiveCD ISO Build with Exact Digest
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Resolving exact container digest from GHCR..."
          DIGEST="$(skopeo inspect docker://ghcr.io/${{ github.repository_owner }}/kushagra-os:44 --format '{{.Digest}}' 2>/dev/null || true)"
          echo "Pushed container digest: ${DIGEST}"
          echo "Triggering LiveCD ISO workflow with immutable digest to eliminate race conditions..."
          gh workflow run iso.yml -f image_tag="44" -f image_digest="${DIGEST}"
