name: Build Bootable LiveCD ISO

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'GHCR image tag to package into LiveCD ISO'
        required: true
        default: '44'
        type: string
      image_digest:
        description: 'Exact cryptographic container digest (e.g. sha256:...)'
        required: false
        default: ''
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: read
  actions: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-iso:
    name: Build LiveCD ISO (Titanoboa)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
      actions: write
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Runner Disk Space
        run: |
          echo "=== Disk space before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          echo "=== Disk space after cleanup ==="
          df -h /

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull Target Container Image into Podman Storage
        run: |
          IMAGE_TAG="${{ github.event.inputs.image_tag || '44' }}"
          IMAGE_DIGEST="${{ github.event.inputs.image_digest || '' }}"
          if [ -n "$IMAGE_DIGEST" ]; then
            IMAGE_PULL_REF="ghcr.io/${{ github.repository_owner }}/kushagra-os@${IMAGE_DIGEST}"
            echo "Pulling verified content-addressed image: ${IMAGE_PULL_REF}"
            sudo podman pull "${IMAGE_PULL_REF}"
            sudo podman tag "${IMAGE_PULL_REF}" "ghcr.io/${{ github.repository_owner }}/kushagra-os:${IMAGE_TAG}"
          else
            IMAGE_PULL_REF="ghcr.io/${{ github.repository_owner }}/kushagra-os:${IMAGE_TAG}"
            echo "Pulling latest tag reference: ${IMAGE_PULL_REF}"
            sudo podman pull "${IMAGE_PULL_REF}"
          fi

      - name: Ensure Titanoboa Contract Compliance
        run: |
          set -euo pipefail
          IMAGE_TAG="${{ github.event.inputs.image_tag || '44' }}"
          IMAGE_REF="ghcr.io/${{ github.repository_owner }}/kushagra-os:${IMAGE_TAG}"
          echo "Injecting verified Titanoboa contract files into ${IMAGE_REF}..."

          # 1. Stage official Fedora signed UEFI binaries (shim + grub2-efi)
          mkdir -p /tmp/efi-staging/boot/efi/EFI/fedora /tmp/efi-staging/boot/efi/EFI/BOOT
          echo "Extracting signed UEFI bootloader binaries via Fedora container..."
          sudo podman run --rm -v /tmp/efi-staging/boot/efi:/out quay.io/fedora/fedora:latest bash -c '
            set -euo pipefail
            dnf install -y shim-x64 grub2-efi-x64
            mkdir -p /out/EFI
            if [ -d /boot/efi/EFI ]; then
              cp -av /boot/efi/EFI/* /out/EFI/
            fi
            if [ -d /usr/lib/efi ]; then
              find /usr/lib/efi -name "*.efi" -exec cp -vf {} /out/EFI/fedora/ \; 2>/dev/null || true
            fi
            mkdir -p /out/EFI/BOOT /out/EFI/fedora
            if [ ! -f /out/EFI/BOOT/BOOTX64.EFI ] && [ -f /out/EFI/fedora/shimx64.efi ]; then
              cp -vf /out/EFI/fedora/shimx64.efi /out/EFI/BOOT/BOOTX64.EFI
            fi
            # Stage signed grub2-efi into EFI/BOOT so shim finds it immediately
            if [ -f /out/EFI/fedora/grubx64.efi ]; then
              cp -vf /out/EFI/fedora/grubx64.efi /out/EFI/BOOT/grubx64.efi
            fi
            # Purge fbx64.efi (fallback) and BOOTX64.CSV to prevent NVRAM modification loops on removable media
            rm -vf /out/EFI/BOOT/fbx64.efi /out/EFI/fedora/fbx64.efi /out/EFI/fedora/BOOTX64.CSV || true
            echo "Staged EFI directory contents:"
            ls -laR /out/EFI
          '

          # 2. Inject iso.yaml and staged boot/efi directory into the container image
          sudo podman create --name kushagra-iso-patch "${IMAGE_REF}"
          sudo podman cp files/system/usr/lib/bootc-image-builder/iso.yaml kushagra-iso-patch:/usr/lib/bootc-image-builder/iso.yaml
          sudo podman cp /tmp/efi-staging/boot kushagra-iso-patch:/
          sudo podman commit kushagra-iso-patch "${IMAGE_REF}"
          sudo podman rm -f kushagra-iso-patch

          # 3. Verify contract compliance inside committed image
          echo "Verifying contract compliance inside ${IMAGE_REF}:"
          sudo podman run --rm "${IMAGE_REF}" ls -la /usr/lib/bootc-image-builder/iso.yaml /boot/efi/EFI/fedora /boot/efi/EFI/BOOT

      - name: Patch Titanoboa GRUB Template for Real Hardware EFI
        run: |
          set -euo pipefail
          echo "Patching Titanoboa build_iso.sh to inject rmmod tpm and memory resilience..."
          TITANOBOA_SCRIPT="$(find /home/runner/work/_actions/ublue-os/titanoboa -name "build_iso.sh" 2>/dev/null | head -n 1)"
          if [ -n "$TITANOBOA_SCRIPT" ] && [ -f "$TITANOBOA_SCRIPT" ]; then
            echo "Found Titanoboa build script at: $TITANOBOA_SCRIPT"
            # Inject rmmod tpm right before load_video in the GRUB template
            sed -i '/function load_video/i rmmod tpm' "$TITANOBOA_SCRIPT"
            # Ensure grubx64.efi is in /work/EFI/BOOT and remove fbx64.efi
            sed -i '/cp -avT \/rootfs\/boot\/efi\/EFI \/work\/EFI/a \cp -vf /work/EFI/fedora/grubx64.efi /work/EFI/BOOT/grubx64.efi || true\nrm -vf /work/EFI/BOOT/fbx64.efi /work/EFI/fedora/fbx64.efi /work/EFI/fedora/BOOTX64.CSV || true' "$TITANOBOA_SCRIPT"
            echo "Verification of patched Titanoboa build script:"
            grep -n -C 5 "rmmod tpm" "$TITANOBOA_SCRIPT" || true
          else
            echo "Titanoboa script search in /home/runner/work/_actions/:"
            find /home/runner/work/_actions/ -name "*.sh" || true
          fi

      - name: Generate LiveCD ISO with Titanoboa
        # Uses Titanoboa composite action to build a bootc bootable LiveCD ISO
        # Configuration contract is baked into the image at /usr/lib/bootc-image-builder/iso.yaml
        uses: ublue-os/titanoboa@main
        id: titanoboa
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/kushagra-os:${{ github.event.inputs.image_tag || '44' }}
          iso-dest: ${{ github.workspace }}/KushagraOS-44.iso

      - name: Stage Final ISO to Workspace
        run: |
          ISO_FILE="${{ steps.titanoboa.outputs.iso-dest }}"
          echo "Titanoboa generated ISO at: $ISO_FILE"
          if [ -f "$ISO_FILE" ]; then
            cp -vf "$ISO_FILE" "${{ github.workspace }}/KushagraOS-44.iso"
          else
            echo "Searching for generated ISO file..."
            find /home/runner/work -name "*KushagraOS*.iso" -exec cp -vf {} "${{ github.workspace }}/KushagraOS-44.iso" \;
          fi
          ls -lh "${{ github.workspace }}/KushagraOS-44.iso"

      - name: Generate SHA256 Checksum
        run: |
          cd "${{ github.workspace }}"
          sha256sum KushagraOS-44.iso > KushagraOS-44.iso-CHECKSUM
          cat KushagraOS-44.iso-CHECKSUM

      - name: Upload ISO Artifact to GitHub Actions
        # Stores the generated ISO directly in GitHub Actions artifacts (supported up to 10 GB per artifact)
        uses: actions/upload-artifact@v4
        with:
          name: KushagraOS-44-iso
          path: |
            ${{ github.workspace }}/KushagraOS-44.iso
            ${{ github.workspace }}/KushagraOS-44.iso-CHECKSUM
          retention-days: 3
          if-no-files-found: error

      - name: Upload ISO to Cloudflare R2 ($0 Egress Storage)
        # Cleanly skipped when R2 credentials are not configured in repository secrets
        if: ${{ env.R2_ACCOUNT_ID != '' && env.R2_BUCKET != '' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 cp KushagraOS-44.iso "s3://${R2_BUCKET}/KushagraOS-44.iso" --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp KushagraOS-44.iso-CHECKSUM "s3://${R2_BUCKET}/KushagraOS-44.iso-CHECKSUM" --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
