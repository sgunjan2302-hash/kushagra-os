type: dnf
repos:
  copr:
    - ublue-os/packages
install:
  skip-unavailable: true
  packages:
    # --- Native VS Code RPM (never Flatpak VS Code) ---
    - code

    # --- Container & Developer Virtualization Stack ---
    # Note: omit podman-docker because docker-ce conflicts with it; podman & distrobox coexist cleanly.
    - distrobox
    - podman
    - podman-compose

    # --- Optional Docker CE Stack (opt-in socket via ujust dx-group) ---
    - docker-ce
    - docker-ce-cli
    - containerd.io
    - docker-buildx-plugin
    - docker-compose-plugin

    # --- Universal Blue COPR DX Utilities ---
    - krunner-bazaar

    # --- Developer Productivity Essentials ---
    - git
    - ripgrep
    - fd-find
    - jq
    - tmux
