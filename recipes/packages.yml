type: dnf
install:
  skip-unavailable: true
  packages:
    # --- Low-RAM System Survival ---
    - earlyoom

    # --- Indic Typography & Input Method Engine (Fcitx5 + m17n) ---
    # Note: Additional Noto Indic font packages should be verified on Fedora 44 before adding
    - lohit-devanagari-fonts
    - fcitx5
    - fcitx5-m17n
    - m17n-db
    - kcm-fcitx5
    - fcitx5-configtool

    # --- Indian DSC Token & Smart Card Subsystem (Feitian ePass2003) ---
    - opensc
    - pcsc-lite-ccid

    # --- Android Subsystem (Waydroid) ---
    - waydroid
    - waydroid-selinux

    # --- Hardware Firmware (Realtek Wi-Fi / Bluetooth) ---
    - realtek-firmware

    # --- Driverless Printing & Scanning (IPP Everywhere / eSCL) ---
    - ipp-usb

    # --- LiveCD Initramfs & Silent OEM Boot Splash ---
    - dracut-live
    - livesys-scripts
    - plymouth
    - plymouth-theme-spinner

    # --- Kushagra Kavach Security Suite (Rule #8/#9: NO clamd daemon, NO clamav-data bloat) ---
    - usbguard
    - usbguard-selinux
    - usbguard-dbus
    - usbguard-notifier
    - clamav
    - clamav-freshclam

    # --- LiveCD Graphical Installer & Partition Management ---
    - anaconda-live
    - anaconda-gui
    - firefox
    - libblockdev-btrfs
    - libblockdev-lvm
    - libblockdev-dm
    - partitionmanager

    # --- Custom First-Boot OOBE & K-AI UI/D-Bus (Qt6/QML + Gio DBus) ---
    - python3-pyqt6
    - python3-gobject

    # --- K-AI Hybrid Inference Engine & Multimodal Utilities ---
    - llama-cpp
    - vulkan-tools
    - tesseract
    - tesseract-langpack-hin
    - spectacle
    - wl-clipboard

    # --- Creator & Dual-Boot Bridges (DaVinci Resolve / WinApps / Windows Reboot) ---
    - distrobox
    - freerdp
    - qemu-kvm
    - edk2-ovmf
    - efibootmgr
    - ffmpeg

    # --- Desktop Utilities & Phone Connectivity ---
    - plasma-firewall
    - kde-connect
