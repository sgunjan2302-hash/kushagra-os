label: "KushagraOS-44"
grub2:
  default: "0"
  timeout: 10
  entries:
    - name: "Start Kushagra OS 44 (LiveCD Desktop)"
      linux: "/images/pxeboot/vmlinuz console=tty0 console=ttyS0 quiet splash root=live:CDLABEL=KushagraOS-44 enforcing=0 rd.live.image"
      initrd: "/images/pxeboot/initrd.img"
    - name: "Start Kushagra OS 44 (Safe Graphics / nomodeset)"
      linux: "/images/pxeboot/vmlinuz console=tty0 console=ttyS0 nomodeset quiet splash root=live:CDLABEL=KushagraOS-44 enforcing=0 rd.live.image"
      initrd: "/images/pxeboot/initrd.img"
