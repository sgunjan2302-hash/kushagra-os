# Ensure first-boot OOBE pending flag exists on fresh bootc disk installations
# (/var files baked at build time are not carried across bootc/ostree deployments unless in tmpfiles.d)
d /var/lib 0755 root root - -
f /var/lib/kushagra-oobe-pending 0644 root root - -

# Materialize LiveCD-only livesys hook even on bootc-deployed filesystems
d /var/lib/livesys 0755 root root - -
C /var/lib/livesys/livesys-session-extra 0755 root root - /usr/share/kushagra-os/livesys/livesys-session-extra

# Runtime home directory and clean Wayland shell config for Kushagra OS OOBE
d /run/kushagra-oobe 0750 kushagra-oobe kushagra-oobe - -
d /run/kushagra-oobe/.config 0750 kushagra-oobe kushagra-oobe - -
d /run/kushagra-oobe/.config/autostart 0750 kushagra-oobe kushagra-oobe - -

# Launch Kushagra Setup Wizard automatically on OOBE login
C /run/kushagra-oobe/.config/autostart/kushagra-oobe-autostart.desktop 0644 kushagra-oobe kushagra-oobe - /usr/share/kushagra-os/oobe/kushagra-oobe-autostart.desktop

# Prevent screen locking, KWallet prompts, and KDE Plasma Welcome during OOBE
f /run/kushagra-oobe/.config/kscreenlockerrc 0644 kushagra-oobe kushagra-oobe - [Daemon]\nAutolock=false\nLockOnResume=false\nTimeout=0
f /run/kushagra-oobe/.config/kwalletrc 0644 kushagra-oobe kushagra-oobe - [Wallet]\nEnabled=false
f /run/kushagra-oobe/.config/plasma-welcomerc 0644 kushagra-oobe kushagra-oobe - [General]\nLastSeenVersion=6.8.0\nShowUpdatePage=false

# Keep Plasma desktop free of panels/taskbars behind the fullscreen OOBE wizard
f /run/kushagra-oobe/.config/plasma-org.kde.plasma.desktop-appletsrc 0644 kushagra-oobe kushagra-oobe - [Containments][1]\nformfactor=2\nlocation=3\nplugin=org.kde.panel\n\n[Containments][1][General]\nthickness=0

# Enable Fcitx5 Wayland input method inside OOBE too
f /run/kushagra-oobe/.config/kwinrc 0644 kushagra-oobe kushagra-oobe - [Wayland]\nInputMethod[$e]=/usr/share/applications/fcitx5-wayland-launcher.desktop\nVirtualKeyboardEnabled=true

Z /run/kushagra-oobe 0750 kushagra-oobe kushagra-oobe - -
