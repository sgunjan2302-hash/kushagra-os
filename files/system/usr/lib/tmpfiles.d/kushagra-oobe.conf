# Ensure /var/lib exists; kushagra-oobe-pending is staged only by installer/kickstart and must not be recreated after OOBE completes
d /var/lib 0755 root root - -

# Materialize LiveCD-only livesys hook even on bootc-deployed filesystems
d /var/lib/livesys 0755 root root - -
C /var/lib/livesys/livesys-session-extra 0755 root root - /usr/share/kushagra-os/livesys/livesys-session-extra

# Runtime home directory and clean Wayland shell config for Kushagra OS OOBE
d /run/kushagra-oobe 0750 kushagra-oobe kushagra-oobe - -
d /run/kushagra-oobe/.config 0750 kushagra-oobe kushagra-oobe - -
d /run/kushagra-oobe/.config/fcitx5 0750 kushagra-oobe kushagra-oobe - -
d /run/kushagra-oobe/.config/autostart 0750 kushagra-oobe kushagra-oobe - -
d /run/kushagra-oobe/.config/systemd 0750 kushagra-oobe kushagra-oobe - -
d /run/kushagra-oobe/.config/systemd/user 0750 kushagra-oobe kushagra-oobe - -
d /run/kushagra-oobe/.config/systemd/user/plasma-workspace-wayland.target.wants 0750 kushagra-oobe kushagra-oobe - -

# Launch Kushagra Setup Wizard automatically on OOBE login
C /run/kushagra-oobe/.config/autostart/kushagra-oobe-autostart.desktop 0644 kushagra-oobe kushagra-oobe - /usr/share/kushagra-os/oobe/kushagra-oobe-autostart.desktop

# Prevent empty Plasma shell panel, splash flash, wallpaper flicker, Polkit software notifier, Baloo, KDE Connect, DrKonqi, and DPMS sleep during OOBE
L+ /run/kushagra-oobe/.config/systemd/user/plasma-plasmashell.service - kushagra-oobe kushagra-oobe - /dev/null
L+ /run/kushagra-oobe/.config/systemd/user/plasma-powerdevil.service - kushagra-oobe kushagra-oobe - /dev/null
L+ /run/kushagra-oobe/.config/systemd/user/plasma-ksplash.service - kushagra-oobe kushagra-oobe - /dev/null
L+ /run/kushagra-oobe/.config/systemd/user/plasma-wallpaper.service - kushagra-oobe kushagra-oobe - /dev/null
L+ /run/kushagra-oobe/.config/systemd/user/drkonqi-coredump-launcher.socket - kushagra-oobe kushagra-oobe - /dev/null
L+ /run/kushagra-oobe/.config/systemd/user/plasma-workspace-wayland.target.wants/kushagra-oobe-ui.service - kushagra-oobe kushagra-oobe - /usr/lib/systemd/user/kushagra-oobe-ui.service
f /run/kushagra-oobe/.config/autostart/org.kde.plasmashell.desktop 0644 kushagra-oobe kushagra-oobe - [Desktop Entry]\nType=Application\nName=Plasma Shell\nHidden=true\n
f /run/kushagra-oobe/.config/autostart/org.kde.discover.notifier.desktop 0644 kushagra-oobe kushagra-oobe - [Desktop Entry]\nType=Application\nName=Discover Notifier\nHidden=true\n
f /run/kushagra-oobe/.config/autostart/baloo_file.desktop 0644 kushagra-oobe kushagra-oobe - [Desktop Entry]\nType=Application\nName=Baloo File Indexer\nHidden=true\n
f /run/kushagra-oobe/.config/autostart/org.kde.kdeconnect.daemon.desktop 0644 kushagra-oobe kushagra-oobe - [Desktop Entry]\nType=Application\nName=KDE Connect\nHidden=true\n
f /run/kushagra-oobe/.config/autostart/powerdevil.desktop 0644 kushagra-oobe kushagra-oobe - [Desktop Entry]\nType=Application\nName=Power Management\nHidden=true\n
f /run/kushagra-oobe/.config/autostart/org.kde.plasma-welcome.desktop 0644 kushagra-oobe kushagra-oobe - [Desktop Entry]\nType=Application\nName=Plasma Welcome\nHidden=true\n
f /run/kushagra-oobe/.config/autostart/org.kde.drkonqi.coredump.gui.desktop 0644 kushagra-oobe kushagra-oobe - [Desktop Entry]\nType=Application\nName=DrKonqi Coredump GUI\nHidden=true\n

# Prevent screen locking, KWallet prompts, splash screen, and KDE Plasma Welcome during OOBE
f /run/kushagra-oobe/.config/kscreenlockerrc 0644 kushagra-oobe kushagra-oobe - [Daemon]\nAutolock=false\nLockOnResume=false\n
f /run/kushagra-oobe/.config/kwalletrc 0644 kushagra-oobe kushagra-oobe - [Wallet]\nEnabled=false
f /run/kushagra-oobe/.config/plasma-welcomerc 0644 kushagra-oobe kushagra-oobe - [General]\nShouldShow=false\nLastSeenVersion=6.8.3\nShowUpdatePage=false
f /run/kushagra-oobe/.config/ksplashrc 0644 kushagra-oobe kushagra-oobe - [KSplash]\nEngine=none\nTheme=None\n

# Keep Plasma desktop free of panels/taskbars behind the fullscreen OOBE wizard
f /run/kushagra-oobe/.config/plasma-org.kde.plasma.desktop-appletsrc 0644 kushagra-oobe kushagra-oobe - [Containments][1]\nplugin=org.kde.plasma.folder\n

# Enable Fcitx5 Wayland input method inside OOBE too
f /run/kushagra-oobe/.config/kwinrc 0644 kushagra-oobe kushagra-oobe - [Wayland]\nInputMethod[$i]=/usr/share/applications/fcitx5-wayland-launcher.desktop\nVirtualKeyboardEnabled=true
C /run/kushagra-oobe/.config/fcitx5/profile 0644 kushagra-oobe kushagra-oobe - /etc/skel/.config/fcitx5/profile

Z /run/kushagra-oobe 0750 kushagra-oobe kushagra-oobe - -
