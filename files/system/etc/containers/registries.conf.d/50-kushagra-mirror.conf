# Kushagra OS Zero-Egress Mirror Configuration (v0.5.0)
# Uses Cloudflare R2 edge cache (oci.kushagraos.org) strictly for content-addressed
# digest pulls (pull-from-mirror = "digest-only").
# Upstream ghcr.io remains authoritative for tags/signatures and automatic fallback.
# Priority 50 ensures local school/office LAN mirrors (90-kushagra-lan-mirror.conf) take precedence.

[[registry]]
prefix = "ghcr.io/sgunjan2302-hash/kushagra-os"
location = "ghcr.io/sgunjan2302-hash/kushagra-os"

[[registry.mirror]]
location = "oci.kushagraos.org/kushagra-os"
pull-from-mirror = "digest-only"

[[registry]]
prefix = "ghcr.io/sgunjan2302-hash/kushagra-os-dx"
location = "ghcr.io/sgunjan2302-hash/kushagra-os-dx"

[[registry.mirror]]
location = "oci.kushagraos.org/kushagra-os-dx"
pull-from-mirror = "digest-only"

[[registry]]
prefix = "ghcr.io/sgunjan2302-hash/kushagra-os-nvidia"
location = "ghcr.io/sgunjan2302-hash/kushagra-os-nvidia"

[[registry.mirror]]
location = "oci.kushagraos.org/kushagra-os-nvidia"
pull-from-mirror = "digest-only"

[[registry]]
prefix = "ghcr.io/sgunjan2302-hash/kushagra-os-dx-nvidia"
location = "ghcr.io/sgunjan2302-hash/kushagra-os-dx-nvidia"

[[registry.mirror]]
location = "oci.kushagraos.org/kushagra-os-dx-nvidia"
pull-from-mirror = "digest-only"
