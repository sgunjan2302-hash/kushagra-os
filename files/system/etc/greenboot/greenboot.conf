# Kushagra OS Greenboot Configuration (greenboot-rs)
#
# Desktop-Safe & Offline-First Policy:
# - Strictly NO network, DNS, or HTTP checks are configured in required.d.
#   Offline laptops, airplanes, and Indian Wi-Fi captive portals will NEVER
#   cause false-positive deployment rollback loops.
# - greenboot-default-health-checks is intentionally excluded from the OS image.

# Maximum failed boot attempts before rolling back to the previous deployment
GREENBOOT_MAX_BOOT_ATTEMPTS=2

# Disable hardware watchdog check (consumer desktops/laptops often omit or
# disable hardware watchdog devices)
GREENBOOT_WATCHDOG_CHECK_ENABLED=false
